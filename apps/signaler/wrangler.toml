name = "scrn-broadcast-signaler"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "SESSAO"
class_name = "SessaoDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessaoDurableObject"]

# Desligador de gasto do TURN (ADR 0007). TURN_KEY_ID, TURN_TOKEN, CF_ACCOUNT_ID e
# CF_ANALYTICS_TOKEN são segredos — `wrangler secret put <nome>` em produção, ou um `.dev.vars`
# local (não versionado) para `wrangler dev`. Sem eles, o sinalizador devolve só STUN.
[vars]
TURN_SPEND_LIMIT_GB = 900

# Limite de taxa por IP nas rotas de entrada. `/sessao/create` cria um Durable Object sem
# autenticação, e a URL do sinalizador é pública (ADR 0005) — sem isto, qualquer um esgota a cota
# diária da conta e ninguém consegue abrir Sessão. `period` só aceita 10 ou 60.
# O miniflare não simula estas bindings: em `wrangler dev` e nos testes elas não existem, e o
# Worker segue sem limite de propósito (ver `src/rateLimit.ts`).
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
