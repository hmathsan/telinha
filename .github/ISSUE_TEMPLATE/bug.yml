name: Problema com o Telinha
description: Algo não funciona como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir: a seção **Solução de Problemas** do
        [README](https://github.com/hmathsan/telinha#-solução-de-problemas-troubleshooting) cobre os casos
        mais comuns — aviso do Windows na instalação, janela preta, transmissão
        travando. Se for um deles, a resposta já está lá.

  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Versão do Telinha
      description: "Aparece no instalador que você baixou, por exemplo 1.0.0."
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      description: "Tecle Win+R, digite `winver`, e copie a linha da versão."
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: papel
    attributes:
      label: Você estava transmitindo ou assistindo?
      description: Encoder e decoder falham de formas diferentes, e isso muda onde procurar.
      options:
        - Transmitindo
        - Assistindo
        - Os dois
        - Nem cheguei a entrar numa Sessão
    validations:
      required: true

  - type: textarea
    id: diagnostico
    attributes:
      label: Diagnóstico exportado
      description: |
        No app, abra o diagnóstico e exporte o arquivo. **Arraste-o para esta caixa.**
        Ele traz bitrate, encoder em uso, perda de pacotes e se a conexão passou por relay — sem
        isso, quase todo problema de mídia vira adivinhação. Não contém a sua tela nem o Código de
        Sessão.
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: Arquivo de log
      description: |
        No mesmo painel de diagnóstico, clique em **Abrir pasta de logs** (ou vá a
        `%APPDATA%\Telinha\logs`) e **arraste o `main.log` para esta caixa.**
        Ele é o único que sobrevive ao app fechar sozinho: traz quedas de conexão com código e
        motivo, falhas de ICE e erros que não deu para mostrar na tela. Não contém a sua tela.
    validations:
      required: false
